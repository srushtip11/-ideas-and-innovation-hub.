<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - College Innovation Hub</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">College Innovation Hub</div>

        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('ideas') }}">Explore Ideas</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('login') }}">Login</a>
        </nav>
    </header>

    <main class="form-container">

        <h1>Contact Us</h1>

        <p>
            Have a question or suggestion? Send us a message.
        </p>

        <form method="POST" action="{{ url_for('contact') }}">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="message">Your Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                required
            ></textarea>

            <button type="submit" class="btn">
                Send Message
            </button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 College Idea Innovation Hub.</p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/validation.js"></script>

</body>
</html>
