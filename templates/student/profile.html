<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Innovation Hub</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">College Innovation Hub</div>

        <nav>
            <a href="{{ url_for('student_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('my_ideas') }}">My Ideas</a>
            <a href="{{ url_for('submit_idea') }}">Submit Idea</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>

    <main class="form-container">

        <h1>My Profile</h1>

        <p>View and update your account information.</p>

        {% if error %}
            <div class="message error-message">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="message success-message">{{ success }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('student_profile') }}">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ user.name }}"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                value="{{ user.email }}"
                readonly
            >

            <label for="department">Department</label>

            <input
                type="text"
                id="department"
                name="department"
                value="{{ user.department }}"
                required
            >

            <button type="submit" class="btn">
                Update Profile
            </button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 College Idea Innovation Hub.</p>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/validation.js"></script>

</body>
</html>
